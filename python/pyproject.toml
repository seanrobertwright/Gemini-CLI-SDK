[project]
name = "gemini-sdk"
version = "0.0.0"
description = "Python SDK for gemini-cli"
requires-python = ">=3.10"
license = "MIT"
readme = "CHANGELOG.md"
authors = [{ name = "Sean Robert Wright" }]
keywords = ["gemini", "gemini-cli", "sdk", "llm", "ai"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
    "anyio>=4.0",
    "jsonschema>=4.0",
    "packaging>=23.0",
    "psutil>=6.0",
    "pydantic>=2.13.2",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "pytest-anyio>=0.0.0",
    "hypothesis>=6.0",
    "mcp[cli]>=1.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Collect both test_* (standard) and run_* (fixture-corpus parametrize helpers that
# must not appear in diff-test-names.sh parity extraction which only scans test_* names)
python_functions = ["test_*", "run_*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
]
