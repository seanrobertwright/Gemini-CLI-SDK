[project]
name = "gemini-sdk"
version = "0.0.0"
description = "Python SDK for gemini-cli"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "anyio>=4.0",
    "psutil>=6.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "pytest-anyio>=0.0.0",
    "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Collect both test_* (standard) and run_* (fixture-corpus parametrize helpers that
# must not appear in diff-test-names.sh parity extraction which only scans test_* names)
python_functions = ["test_*", "run_*"]
