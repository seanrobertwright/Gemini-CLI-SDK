site_name: Gemini SDK — Python API
site_url: https://seanrobertwright.github.io/Gemini-CLI-SDK/python/api/
docs_dir: docs-python
site_dir: docs/public/python/api
use_directory_urls: true

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python/src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true

nav:
  - API Reference: index.md
