name: Release (npm)

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create version-bump PR + push tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write      # reserved for future npm OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run tests before release
        run: pnpm -C ts test --run
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run ci:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Mirror CHANGELOG to Python
        if: steps.changesets.outputs.published == 'true'
        run: |
          bash scripts/mirror-changelog.sh
          if ! git diff --quiet python/CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add python/CHANGELOG.md
            git commit -m "chore(release): mirror CHANGELOG to python"
            git push
          fi
